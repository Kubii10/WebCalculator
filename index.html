<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
    </head>
    <body>
        <div class="main" id="main">
            <input id="screen" value="0" type="text" readonly style="width: 404px; height: 100px;">
            <div class="buttons" id="buttons">
                <button id="1" onclick="add('1')">1</button>
                <button id="2" onclick="add('2')">2</button>
                <button id="3" onclick="add('3')">3</button>
                <button id="plus" onclick="operation('+')">+</button><br>
                <button id="4" onclick="add('4')">4</button>
                <button id="5" onclick="add('5')">5</button>
                <button id="6" onclick="add('6')">6</button>
                <button id="minus" onclick="operation('-')">-</button><br>
                <button id="7" onclick="add('7')">7</button>
                <button id="8" onclick="add('8')">8</button>
                <button id="9" onclick="add('9')">9</button>
                <button id="calculate" onclick="equal()">=</button><br>
                <button id="multiply" onclick="operation('*')">*</button>
                <button id="0" onclick="add('0')">0</button>
                <button id="divide" onclick="operation('/')">/</button>
                <button id="clear" onclick="clearScreen()">C</button>
                
            </div>
        </div>
        <link rel="stylesheet" href="index.css">
        <script src="index.js"></script>
    </body>
</html>
